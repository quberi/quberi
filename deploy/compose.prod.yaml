# Production overlay: adds a reverse proxy in front of the existing stack.
# Usage (run from the repo root on the server):
#   docker compose --env-file .env -f compose.yaml -f deploy/compose.prod.yaml --profile app up -d --build
#
# This does NOT change any existing service — it only adds `caddy` and
# removes the need to publish web/api ports to the host, since caddy now
# terminates TLS and proxies to them over the internal `quberi` network.

services:
  caddy:
    image: caddy:2.9-alpine
    profiles: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [quberi]

  # The admin Traffic page reads caddy's access log. The volume is mounted read-only; the
  # file is root-owned (0600) and the api container runs as root, so it can read it.
  api:
    environment:
      QUBERI_ACCESS_LOG_PATH: /caddy-data/access.log
      QUBERI_TRAFFIC_SITE_HOSTS: ai.quberi.com,api.quberi.com,mcp.quberi.com,quberi.com
    volumes:
      - caddy-data:/caddy-data:ro

volumes:
  caddy-data:
  caddy-config:
