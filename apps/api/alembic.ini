# Alembic config for Quberi.
#
# The database URL is intentionally left blank here: env.py reads it from the
# runtime ``Settings`` object so we have exactly one source of truth. Do not
# add ``sqlalchemy.url`` back to this file.

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
timezone = UTC
truncate_slug_length = 40
# ``rev`` is a monotonically-increasing 4-digit ID (0001, 0002, ...); we keep
# filenames short since ``revision`` inside each file is the source of truth.
file_template = %%(rev)s_%%(slug)s

# We intentionally leave [post_write_hooks] out. Run ``ruff check --fix`` from
# the top-level Makefile/CI after generating a migration.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
