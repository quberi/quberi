server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static legal pages (no React routing) — serve the real HTML file for
  # both the extensionless path (used in OAuth consent screen config) and
  # the .html path, instead of falling through to the SPA shell.
  location = /privacy {
    try_files /privacy.html =404;
  }
  location = /terms {
    try_files /terms.html =404;
  }
  # Static content pages for search: real HTML, not the SPA shell.
  location = /permissions {
    try_files /permissions.html =404;
  }
  location = /manufacturing {
    try_files /manufacturing.html =404;
  }
  location = /en {
    try_files /en.html =404;
  }
  location = /why {
    try_files /why.html =404;
  }
  location = /why-en {
    try_files /why-en.html =404;
  }
  location = /privacy-en {
    try_files /privacy-en.html =404;
  }
  location = /terms-en {
    try_files /terms-en.html =404;
  }

  # Platform-admin dashboard — a separate Vite entry (admin.html), not part
  # of the main SPA's view system. Serves its own bundle; falls through to
  # admin.html for any sub-path so a reload under /admin/* still works.
  location /admin {
    try_files /admin.html =404;
  }

  # Discovery documents (/.well-known/*, e.g. OAuth or MCP metadata) are served
  # by the API host, not by this site. Without this rule the SPA fallback below
  # would answer them with index.html and a 200, and a client that expects JSON
  # would try to parse HTML. Answer a plain 404 instead.
  location ^~ /.well-known {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
