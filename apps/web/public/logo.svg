<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f2594" />
      <stop offset="54%" stop-color="#7356e8" />
      <stop offset="100%" stop-color="#b076ff" />
    </linearGradient>
    <filter id="qShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6946da" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="58" fill="url(#qGradient)" filter="url(#qShadow)" />
  <rect x="17" y="17" width="222" height="222" rx="57" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />

  <!-- Hand-drawn lowercase "q": a rounded bowl + a straight descender,
       built from fixed path geometry (no font dependency), so it
       renders identically in every browser and every conversion tool. -->
  <g transform="translate(128,120)" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round">
    <circle cx="-6" cy="6" r="38" />
    <path d="M 30 -18 L 30 74" stroke-linecap="round" />
  </g>
</svg>
